<script>
  const bgMusic = document.getElementById("bgMusic");
  let musicStarted = false;

  // Play music on first click anywhere
  document.body.addEventListener("click", () => {
    if (!musicStarted) {
      bgMusic.play().catch(err => console.log("Playback prevented:", err));
      musicStarted = true;
    }
  }, { once: true }); // triggers only once
</script>

<script>
async function notifyClick(pageName, destination) {
    try {
        await fetch("https://api.web3forms.com/submit", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify({
                access_key: "8a5453d4-39a8-44d1-ae0c-4b2eee513c56",
                subject: "Website Link Clicked",
                name: "Website Tracker",
                email: "tracker@example.com",
                message: pageName + " was clicked.\n\nTime: " + new Date().toLocaleString()
            })
        });
    } catch (err) {
        console.error(err);
    }

    window.location.href = destination;
}
</script>
